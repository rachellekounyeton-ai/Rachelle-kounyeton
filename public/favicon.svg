      .background { fill: #10110F; stroke: #262922; }
      .monogram { fill: #BEF264; }
    }
  </style>
  <rect class="background" x="2" y="2" width="60" height="60" rx="14" stroke-width="2" />
  <text class="monogram" x="32" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-2">RK</text>
</svg>
